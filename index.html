<!DOCTYPE html>
<html lang="en">
<style>
    *{
box-sizing: border-box;
margin: 0;
padding: 0;
}

body{
 background-color: #ffe6eb;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 font-family: 'Segoe UI',sans-serif;
 gap: 25px;
}

.envelope-wrapper{
    position: relative;
    width: 380px;
    height: 260px;
    background-color: #d9354f;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    margin-top: 80px;
}

/*Top Triangle Flap*/
.flap{
    position: absolute;
    top: 0;
    left: 0;
    width:0;
    height: 0;
    border-left: 190px solid transparent;
    border-right: 190px solid transparent;
    border-top: 140px solid #c9302c;
    transform-origin: top;
    transition: transform 0.6s ease, z-index 0.2s;
    z-index: 4;
}
/*Front Envelope Pocket*/
.pocket{
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 190px solid #e4605c;
    border-right: 190px solid #e4650c;
    border-bottom: 130px solid #d9534f;
    border-top: 130px solid transparent;
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
    z-index: 3;
}
/*The Letter Card Inside*/
.letter {
 position: absolute;
 bottom: 10px;
 left: 15px;
 width: 350px;
 height: 230px;
 background-color: #ffffff;
 border-radius: 6px;
 padding: 12px 15px;
 box-shadow: 0 2px 10px rgba(0,0,0,1);
 transition: transform 0.6s ease 0.3s, z-index 0.2s;
 z-index: 2;
}

.letter p{
    margin-bottom: 10px;
    font-size: 14px;
    color: #333;
}

/* Open Animation Triggered by JavaScript */
.envelope-wrapper.open .flap{
    transform: rotateX(180deg);
    z-index: 1;
}

.envelope-wrapper.open .letter{
    transform: translateY(-115px);
    z-index: 5;
}

/* Button */
button{
    padding: 8px 18px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 8px;
    transition: transform 0.2s;
}

#openBtn, #yesBtn {
    background-color: #ff4d6d;
    color: white;
    }

#noBtn {
    background-color: #eeeeee;
    color: #555555;
    position: relative;
}
</style>
